server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header keamanan dipindah dari next.config.mjs headers(): static export
    # tidak menerapkannya. Nilai harus sama dengan nginx produksi.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # PENTING: jangan pakai add_header di dalam location — deklarasi di location
    # menggantikan seluruh header server-level, bukan menambah.
    location /api/ {
        # Resolver Docker + upstream lewat variabel: tanpa ini nginx menyimpan IP
        # `api` saat start, sehingga setiap kali container api di-recreate (tiap
        # deploy) edge membalas 502 "connect() failed (111: Connection refused)"
        # sampai edge di-restart manual. Dengan bentuk variabel, nama di-resolve
        # ulang mengikuti TTL 10s. `$request_uri` wajib: proxy_pass variabel tidak
        # lagi menambahkan sisa URI otomatis.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:4000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # Static export menulis nama file datar: /dashboard -> dashboard.html,
    # /dashboard/booking -> dashboard/booking.html.
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
